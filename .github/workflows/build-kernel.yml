name: Build KernelSU Kernel for Moto G45 (fogos)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev \
            libncurses5-dev lld device-tree-compiler libelf-dev \
            zlib1g-dev wget tar clang-14 llvm-14 \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
          # Symlinks
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/ld.lld-14 /usr/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-14 /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14 /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14 /usr/bin/llvm-strip

      - name: Set compiler env
        run: |
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "O=out" >> $GITHUB_ENV

      - name: Clone KernelSU
        run: git clone https://github.com/tiann/KernelSU.git KernelSU

      - name: Patch kernel sources
        run: |
          sed -i 's/&unusable_fops/\&unusable_sops/g' mm/vmstat.c
          sed -i 's/&extfrag_fops/\&extfrag_sops/g' mm/vmstat.c
          sed -i '1s/^/#include <trace\/hooks\/locking.h>\n/' kernel/locking/rtmutex.c
          sed -i 's/CONFIG_NFS_FS=y/# CONFIG_NFS_FS is not set/' arch/arm64/configs/defconfig

      - name: Enable KernelSU and setup defconfig
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/defconfig
          make O=$O defconfig \
            ARCH=$ARCH \
            CC=$CC \
            LD=$LD \
            AR=$AR \
            NM=$NM \
            OBJCOPY=$OBJCOPY \
            OBJDUMP=$OBJDUMP \
            STRIP=$STRIP \
            LLVM=$LLVM \
            LLVM_IAS=$LLVM_IAS \
            CROSS_COMPILE=$CROSS_COMPILE

      - name: Build kernel
        run: |
          make -C . O=$O -j$(nproc) \
            ARCH=$ARCH \
            CC=$CC \
            LD=$LD \
            AR=$AR \
            NM=$NM \
            OBJCOPY=$OBJCOPY \
            OBJDUMP=$OBJDUMP \
            STRIP=$STRIP \
            LLVM=$LLVM \
            LLVM_IAS=$LLVM_IAS \
            CROSS_COMPILE=$CROSS_COMPILE 2>&1 | tee build.log; \
          exit ${PIPESTATUS[0]}

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
