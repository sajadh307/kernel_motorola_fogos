name: Build KernelSU Kernel for Moto G45 (fogos)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev \
            libncurses5-dev device-tree-compiler libelf-dev \
            zlib1g-dev wget tar clang llvm lld \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Set compiler env
        run: |
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Patch kernel sources
        run: |
          # Fix 1: vmstat.c uses DEFINE_SEQ_ATTRIBUTE which doesn't exist in kernel 5.4
          # Replace the macro calls with explicit file_operations structs
          python3 << 'PYEOF'
          with open('mm/vmstat.c', 'r') as f:
              content = f.read()

          content = content.replace(
              'DEFINE_SEQ_ATTRIBUTE(unusable);',
              """static int unusable_open(struct inode *inode, struct file *file)
          {
              return seq_open(file, &unusable_sops);
          }
          static const struct file_operations unusable_fops = {
              .owner   = THIS_MODULE,
              .open    = unusable_open,
              .read    = seq_read,
              .llseek  = seq_lseek,
              .release = seq_release,
          };"""
          )

          content = content.replace(
              'DEFINE_SEQ_ATTRIBUTE(extfrag);',
              """static int extfrag_open(struct inode *inode, struct file *file)
          {
              return seq_open(file, &extfrag_sops);
          }
          static const struct file_operations extfrag_fops = {
              .owner   = THIS_MODULE,
              .open    = extfrag_open,
              .read    = seq_read,
              .llseek  = seq_lseek,
              .release = seq_release,
          };"""
          )

          with open('mm/vmstat.c', 'w') as f:
              f.write(content)
          print("vmstat.c patched OK")
          PYEOF

          # Fix 2: rtmutex.c calls Android vendor hooks but is missing the header
          sed -i '1s|^|#include <trace/hooks/locking.h>\n|' kernel/locking/rtmutex.c
          echo "rtmutex.c patched OK"

      - name: Enable KernelSU and setup defconfig
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/defconfig
          make O=out defconfig \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build kernel
        run: |
          make -C . O=out -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log; \
          exit ${PIPESTATUS[0]}

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
