name: Build Motorola Fogos Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          # This points directly to your repository
          repository: sajadh307/kernel_motorola_fogos
          ref: 15.0
          fetch-depth: 1
          submodules: recursive

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex git curl \
            libelf-dev libssl-dev libncurses-dev \
            python3 clang lld llvm gcc-aarch64-linux-gnu

      - name: Prepare Build Environment
        run: |
          mkdir -p out
          # We use the defconfig found in your logs
          make O=out ARCH=arm64 vendor/fogos_defconfig

      - name: Run Build
        run: |
          # We use LLVM=1 to ensure we use Clang/LLD properly
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 2>&1 | tee build.log
          
          # This ensures the workflow fails if the make command fails
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit 1; fi

      - name: Upload Logs & Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fogos-Kernel-Output
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            build.log
