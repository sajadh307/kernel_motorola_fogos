name: Build KernelSU Kernel for Moto G45 (fogos)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev \
            libncurses5-dev device-tree-compiler libelf-dev \
            zlib1g-dev wget tar clang llvm lld \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Set compiler env
        run: |
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Patch kernel sources
        run: |
          # Fix 1: vmstat.c - DEFINE_SEQ_ATTRIBUTE doesn't exist in kernel 5.4
          python3 << 'PYEOF'
          with open('mm/vmstat.c', 'r') as f:
              content = f.read()
          content = content.replace(
              'DEFINE_SEQ_ATTRIBUTE(unusable);',
              """static int unusable_open(struct inode *inode, struct file *file)
          {
              return seq_open(file, &unusable_sops);
          }
          static const struct file_operations unusable_fops = {
              .owner   = THIS_MODULE,
              .open    = unusable_open,
              .read    = seq_read,
              .llseek  = seq_lseek,
              .release = seq_release,
          };"""
          )
          content = content.replace(
              'DEFINE_SEQ_ATTRIBUTE(extfrag);',
              """static int extfrag_open(struct inode *inode, struct file *file)
          {
              return seq_open(file, &extfrag_sops);
          }
          static const struct file_operations extfrag_fops = {
              .owner   = THIS_MODULE,
              .open    = extfrag_open,
              .read    = seq_read,
              .llseek  = seq_lseek,
              .release = seq_release,
          };"""
          )
          with open('mm/vmstat.c', 'w') as f:
              f.write(content)
          print("vmstat.c patched OK")
          PYEOF

          # Fix 2: rtmutex.c - stub out missing Android vendor hook calls
          sed -i 's/trace_android_vh_rtmutex_wait_start(lock);/\/\/ trace_android_vh_rtmutex_wait_start(lock); \/\* stubbed \*\//' kernel/locking/rtmutex.c
          sed -i 's/trace_android_vh_rtmutex_wait_finish(lock);/\/\/ trace_android_vh_rtmutex_wait_finish(lock); \/\* stubbed \*\//' kernel/locking/rtmutex.c
          echo "rtmutex.c patched OK"

          # Fix 3: NFS disabled - not needed on phone
          sed -i 's/CONFIG_NFS_FS=y/# CONFIG_NFS_FS is not set/' arch/arm64/configs/defconfig
          sed -i 's/CONFIG_NFS_V2=y/# CONFIG_NFS_V2 is not set/' arch/arm64/configs/defconfig
          sed -i 's/CONFIG_NFS_V3=y/# CONFIG_NFS_V3 is not set/' arch/arm64/configs/defconfig
          sed -i 's/CONFIG_NFS_V4=y/# CONFIG_NFS_V4 is not set/' arch/arm64/configs/defconfig
          echo "NFS disabled OK"

          # Fix 4: taskstats.c - bare #elif (no condition) and missing sysstats_fill_zoneinfo
          python3 << 'PYEOF'
          with open('kernel/taskstats.c', 'r') as f:
              lines = f.readlines()
          fixed = []
          i = 0
          while i < len(lines):
              line = lines[i]
              # Fix bare #elif with no condition -> #else
              if line.strip() == '#elif':
                  fixed.append('#else\n')
                  print(f"Fixed bare #elif at line {i+1}")
              else:
                  fixed.append(line)
              i += 1
          with open('kernel/taskstats.c', 'w') as f:
              f.writelines(fixed)
          print("taskstats.c patched OK")
          PYEOF

          # Fix 5: fdinfo.c - add missing struct file* param to show function implementations
          python3 << 'PYEOF'
          import re
          with open('fs/notify/fdinfo.c', 'r') as f:
              content = f.read()
          # Add struct file *f to all 2-arg show function definitions
          content = re.sub(
              r'(static void \w+\(struct seq_file \*\w+, struct fsnotify_mark \*\w+\))',
              lambda m: m.group(0).rstrip(')') + ', struct file *__unused_f)',
              content
          )
          with open('fs/notify/fdinfo.c', 'w') as f:
              f.write(content)
          print("fdinfo.c patched OK")
          PYEOF

      - name: Enable KernelSU and setup defconfig
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/defconfig
          make O=out defconfig \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build kernel
        run: |
          make -C . O=out -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log; \
          exit ${PIPESTATUS[0]}

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
