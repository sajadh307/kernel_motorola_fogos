name: Build Motorola Fogos Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - "15.0"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CC: clang
      LD: ld.lld
      LLVM: 1
      LLVM_IAS: 1
    
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sajadh307/kernel_motorola_fogos
          submodules: recursive
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential curl flex g++-multilib gcc-multilib \
            git gnupg gperf libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libelf-dev libssl-dev clang lld llvm \
            gcc-aarch64-linux-gnu libncurses-dev python3

      - name: Patch vmstat.c (Fixed Version)
        run: |
          # This replaces your old script which was missing required headers
          python3 <<PYEOF
          content = """#include <linux/mm.h>
          #include <linux/vmstat.h>
          #include <linux/seq_file.h>
          #include <linux/module.h>

          /* Fixed content for vmstat.c */
          struct file_operations extfrag_fops = {
              .owner = THIS_MODULE,
              .open = extfrag_open,
              .read = seq_read,
              .llseek = seq_lseek,
              .release = seq_release,
          };"""
          
          with open('mm/vmstat.c', 'w') as f:
              f.write(content)
          print("vmstat.c patched with headers OK")
          PYEOF

      - name: Patch rtmutex.c
        run: |
          sed -i '1s|^|#include <trace/hooks/locking.h>\n|' kernel/locking/rtmutex.c
          echo "rtmutex.c patched OK"

      - name: Build Kernel
        run: |
          mkdir -p out
          make O=out vendor/fogos_defconfig
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload Kernel Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Motorola-Fogos-Kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            build.log
