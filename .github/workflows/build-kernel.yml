name: Build KernelSU Kernel for Moto G45 (fogos)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev \
            libncurses5-dev device-tree-compiler libelf-dev \
            zlib1g-dev wget tar clang llvm lld \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Set compiler env
        run: |
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Patch kernel sources
        run: |
          python3 << 'PYEOF'
          import re

          # Fix 1: vmstat.c
          with open('mm/vmstat.c', 'r') as f:
              c = f.read()
          c = c.replace('DEFINE_SEQ_ATTRIBUTE(unusable);',
              "static int unusable_open(struct inode *i, struct file *f)"
              " { return seq_open(f, &unusable_sops); }\n"
              "static const struct file_operations unusable_fops = {"
              " .owner=THIS_MODULE, .open=unusable_open, .read=seq_read,"
              " .llseek=seq_lseek, .release=seq_release };")
          c = c.replace('DEFINE_SEQ_ATTRIBUTE(extfrag);',
              "static int extfrag_open(struct inode *i, struct file *f)"
              " { return seq_open(f, &extfrag_sops); }\n"
              "static const struct file_operations extfrag_fops = {"
              " .owner=THIS_MODULE, .open=extfrag_open, .read=seq_read,"
              " .llseek=seq_lseek, .release=seq_release };")
          with open('mm/vmstat.c', 'w') as f:
              f.write(c)
          print("vmstat.c OK")

          # Fix 2: rtmutex.c
          with open('kernel/locking/rtmutex.c', 'r') as f:
              c = f.read()
          c = c.replace('trace_android_vh_rtmutex_wait_start(lock);',
                        '/* trace_android_vh_rtmutex_wait_start stubbed */')
          c = c.replace('trace_android_vh_rtmutex_wait_finish(lock);',
                        '/* trace_android_vh_rtmutex_wait_finish stubbed */')
          with open('kernel/locking/rtmutex.c', 'w') as f:
              f.write(c)
          print("rtmutex.c OK")

          # Fix 3: taskstats.c bare #elif
          with open('kernel/taskstats.c', 'r') as f:
              lines = f.readlines()
          lines = ['#else\n' if l.strip() == '#elif' else l for l in lines]
          with open('kernel/taskstats.c', 'w') as f:
              f.writelines(lines)
          print("taskstats.c OK")

          # Fix 4: fdinfo.c missing struct file* param
          with open('fs/notify/fdinfo.c', 'r') as f:
              c = f.read()
          c = re.sub(
              r'(static void \w+\(struct seq_file \*\w+,\s*struct fsnotify_mark \*\w+\))',
              lambda m: m.group(0)[:-1] + ', struct file *__f)',
              c)
          with open('fs/notify/fdinfo.c', 'w') as f:
              f.write(c)
          print("fdinfo.c OK")

          # Fix 5: qrtr/tun.c missing 4th arg
          with open('net/qrtr/tun.c', 'r') as f:
              c = f.read()
          c = c.replace(
              'qrtr_endpoint_register(&tun->ep, QRTR_EP_NET_ID_AUTO, 0)',
              'qrtr_endpoint_register(&tun->ep, QRTR_EP_NET_ID_AUTO, 0, false)')
          with open('net/qrtr/tun.c', 'w') as f:
              f.write(c)
          print("qrtr/tun.c OK")

          # Fix 6: Remove broken non-SM6375 qcom clock drivers from Makefile
          # gcc-qcs404 (QCS404 chip) and apcs-msm8916 (MSM8916 chip) are not
          # needed for SM6375 and have broken/incompatible code
          with open('drivers/clk/qcom/Makefile', 'r') as f:
              lines = f.readlines()
          before = len(lines)
          lines = [l for l in lines if 'gcc-qcs404' not in l and 'apcs-msm8916' not in l]
          after = len(lines)
          with open('drivers/clk/qcom/Makefile', 'w') as f:
              f.writelines(lines)
          print(f"qcom/Makefile: removed {before-after} lines OK")

          # Fix 7: mac80211 minstrel duplicate symbols
          # Remove the minstrel inclusion from mac80211 entirely
          with open('net/mac80211/Makefile', 'r') as f:
              c = f.read()
          # Comment out the line that adds minstrel objects to mac80211
          c = re.sub(
              r'^(mac80211-\$\(CONFIG_MAC80211_RC_MINSTREL\)\s*\+=.*)',
              r'# PATCHED_OUT: \1',
              c, flags=re.MULTILINE)
          # Also remove the rc80211_minstrel-y definition to avoid orphan objects
          c = re.sub(
              r'^(rc80211_minstrel-y\s*:=)',
              r'# PATCHED_OUT: \1',
              c, flags=re.MULTILINE)
          c = re.sub(
              r'^(rc80211_minstrel-\$\(CONFIG_MAC80211_DEBUGFS\)\s*\+=)',
              r'# PATCHED_OUT: \1',
              c, flags=re.MULTILINE)
          with open('net/mac80211/Makefile', 'w') as f:
              f.write(c)
          print("mac80211 Makefile minstrel removed OK")

          print("All patches done")
          PYEOF

          # Disable NFS
          for cfg in CONFIG_NFS_FS CONFIG_NFS_V2 CONFIG_NFS_V3 CONFIG_NFS_V4; do
            sed -i "s/${cfg}=y/# ${cfg} is not set/" arch/arm64/configs/defconfig
            sed -i "s/${cfg}=m/# ${cfg} is not set/" arch/arm64/configs/defconfig
          done
          echo "NFS disabled OK"

      - name: Enable KernelSU and setup defconfig
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/defconfig
          make O=out defconfig \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build kernel
        run: |
          make -C . O=out -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log; \
          exit ${PIPESTATUS[0]}

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
