name: Build Moto G45 Fogos Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: prabhatkrmishra/kernel_motorola_fogos
          ref: 15.0
          fetch-depth: 1
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex git curl \
            libelf-dev libssl-dev libncurses-dev \
            python3 clang lld llvm gcc-aarch64-linux-gnu

      - name: Setup Configuration
        run: |
          mkdir -p out
          # This repo uses the SM6375 vendor config for the G45
          make O=out ARCH=arm64 vendor/fogos_defconfig || make O=out ARCH=arm64 vendor/holi_defconfig

      - name: Compile Kernel
        run: |
          # Standard LLVM/Clang build for Motorola
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 2>&1 | tee build.log
          
          # Force job failure if compilation fails
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit 1; fi

      - name: Upload Kernel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Moto-G45-Fogos-Kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            build.log
