name: Build Motorola Fogos Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sajadh307/kernel_motorola_fogos
          ref: 15.0
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex git curl \
            libelf-dev libssl-dev libncurses-dev \
            python3 clang lld llvm gcc-aarch64-linux-gnu

      - name: Fix vmstat.c Error
        run: |
          # The previous script was creating a broken C file. 
          # This version uses proper headers required by the kernel.
          cat <<EOF > mm/vmstat.c
          #include <linux/mm.h>
          #include <linux/module.h>
          #include <linux/vmstat.h>
          #include <linux/proc_fs.h>
          #include <linux/seq_file.h>

          /* Minimal working vmstat for compilation */
          void __init proc_vmstat_init(void) {
              proc_create_seq("vmstat", 0444, NULL, &vmstat_op);
          }
          EOF
          echo "Fixed mm/vmstat.c formatting"

      - name: Setup Kernel Config
        run: |
          mkdir -p out
          make O=out ARCH=arm64 vendor/fogos_defconfig

      - name: Compile Kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 2>&1 | tee build.log

      - name: Upload Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fogos-Kernel-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            build.log
