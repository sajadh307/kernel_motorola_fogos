name: Build KernelSU Kernel for Moto G45 (fogos)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev \
            libncurses5-dev device-tree-compiler libelf-dev \
            zlib1g-dev wget tar clang llvm lld \
            binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

      - name: Set compiler env
        run: |
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Apply SuSFS patches
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-5.4 susfs4ksu
          echo "SuSFS repo contents:"
          find susfs4ksu -name "*.patch" | head -20
          find susfs4ksu -name "*.c" -o -name "*.h" | head -20

          # Copy SuSFS source files
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/ 2>/dev/null || \
          find susfs4ksu -name "susfs.c" -exec cp {} fs/ \;

          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || \
          find susfs4ksu -name "susfs.h" -exec cp {} include/linux/ \;

          find susfs4ksu -name "susfs_def.h" -exec cp {} include/linux/ \; 2>/dev/null || true

          # Apply patches - find them regardless of exact path
          FS_PATCH=$(find susfs4ksu -name "*susfs*fs*.patch" | head -1)
          KERNEL_PATCH=$(find susfs4ksu -name "*susfs*kernel*.patch" | head -1)

          echo "FS patch: $FS_PATCH"
          echo "Kernel patch: $KERNEL_PATCH"

          [ -n "$FS_PATCH" ] && patch -p1 < "$FS_PATCH" || echo "FS patch not found/failed"
          [ -n "$KERNEL_PATCH" ] && patch -p1 < "$KERNEL_PATCH" || echo "Kernel patch not found/failed"

          # Add susfs to fs/Makefile if not already there
          grep -q "susfs.o" fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile

          echo "SuSFS setup done"

      - name: Patch kernel sources
        run: |
          python3 << 'PYEOF'
          import re, os, glob

          # Fix 1: vmstat.c
          with open('mm/vmstat.c', 'r') as f:
              c = f.read()
          c = c.replace('DEFINE_SEQ_ATTRIBUTE(unusable);',
              "static int unusable_open(struct inode *i, struct file *f)"
              " { return seq_open(f, &unusable_sops); }\n"
              "static const struct file_operations unusable_fops = {"
              " .owner=THIS_MODULE, .open=unusable_open, .read=seq_read,"
              " .llseek=seq_lseek, .release=seq_release };")
          c = c.replace('DEFINE_SEQ_ATTRIBUTE(extfrag);',
              "static int extfrag_open(struct inode *i, struct file *f)"
              " { return seq_open(f, &extfrag_sops); }\n"
              "static const struct file_operations extfrag_fops = {"
              " .owner=THIS_MODULE, .open=extfrag_open, .read=seq_read,"
              " .llseek=seq_lseek, .release=seq_release };")
          with open('mm/vmstat.c', 'w') as f:
              f.write(c)
          print("vmstat.c OK")

          # Fix 2: rtmutex.c
          with open('kernel/locking/rtmutex.c', 'r') as f:
              c = f.read()
          c = c.replace('trace_android_vh_rtmutex_wait_start(lock);',
                        '/* trace_android_vh_rtmutex_wait_start stubbed */')
          c = c.replace('trace_android_vh_rtmutex_wait_finish(lock);',
                        '/* trace_android_vh_rtmutex_wait_finish stubbed */')
          with open('kernel/locking/rtmutex.c', 'w') as f:
              f.write(c)
          print("rtmutex.c OK")

          # Fix 3: taskstats.c bare #elif
          with open('kernel/taskstats.c', 'r') as f:
              lines = f.readlines()
          lines = ['#else\n' if l.strip() == '#elif' else l for l in lines]
          with open('kernel/taskstats.c', 'w') as f:
              f.writelines(lines)
          print("taskstats.c OK")

          # Fix 4: fdinfo.c missing struct file* param
          with open('fs/notify/fdinfo.c', 'r') as f:
              c = f.read()
          c = re.sub(
              r'(static void \w+\(struct seq_file \*\w+,\s*struct fsnotify_mark \*\w+\))',
              lambda m: m.group(0)[:-1] + ', struct file *__f)',
              c)
          with open('fs/notify/fdinfo.c', 'w') as f:
              f.write(c)
          print("fdinfo.c OK")

          # Fix 5: qrtr/tun.c missing 4th arg
          with open('net/qrtr/tun.c', 'r') as f:
              c = f.read()
          c = c.replace(
              'qrtr_endpoint_register(&tun->ep, QRTR_EP_NET_ID_AUTO, 0)',
              'qrtr_endpoint_register(&tun->ep, QRTR_EP_NET_ID_AUTO, 0, false)')
          with open('net/qrtr/tun.c', 'w') as f:
              f.write(c)
          print("qrtr/tun.c OK")

          # Fix 6: Remove broken qcom clock drivers
          with open('drivers/clk/qcom/Makefile', 'r') as f:
              lines = f.readlines()
          lines = [l for l in lines if 'gcc-qcs404' not in l and 'apcs-msm8916' not in l]
          with open('drivers/clk/qcom/Makefile', 'w') as f:
              f.writelines(lines)
          print("qcom/Makefile OK")

          # Fix 7: mac80211 minstrel - keep built-in (=y), just fix duplicate object issue
          # The working kernel has CONFIG_MAC80211_RC_MINSTREL=y built-in
          # The duplicate symbol was from minstrel_ht being included twice
          # Fix: ensure minstrel_ht.o is only listed once in the Makefile
          with open('net/mac80211/Makefile', 'r') as f:
              lines = f.readlines()
          seen = set()
          new_lines = []
          for l in lines:
              key = l.strip()
              if 'minstrel' in key and key in seen:
                  new_lines.append('# DEDUP: ' + l)
              else:
                  new_lines.append(l)
                  if 'minstrel' in key:
                      seen.add(key)
          with open('net/mac80211/Makefile', 'w') as f:
              f.writelines(new_lines)
          print("mac80211 Makefile deduped OK")

          # Fix 8: FB_EARLY_EVENT_BLANK - patch all touchscreen drivers
          ts_files = glob.glob('drivers/input/touchscreen/**/*.c', recursive=True)
          patched = 0
          for path in ts_files:
              with open(path, 'r', errors='ignore') as f:
                  c = f.read()
              if 'FB_EARLY_EVENT_BLANK' in c and '#define FB_EARLY_EVENT_BLANK' not in c:
                  c = '#ifndef FB_EARLY_EVENT_BLANK\n#define FB_EARLY_EVENT_BLANK 0x10\n#endif\n' + c
                  with open(path, 'w') as f:
                      f.write(c)
                  patched += 1
          print(f"FB_EARLY_EVENT_BLANK fix applied to {patched} files OK")

          # Fix 9: i2c-qcom-geni.c
          with open('drivers/i2c/busses/i2c-qcom-geni.c', 'r') as f:
              lines = f.readlines()
          last_include = max((i for i, l in enumerate(lines) if l.strip().startswith('#include')), default=0)
          shim = (
              '\n/* compat shim */\n'
              'static inline void geni_write_reg(u32 val, void __iomem *base, int offset)\n'
              '{ writel_relaxed(val, base + offset); }\n\n'
          )
          full = ''.join(lines)
          if 'static inline void geni_write_reg' not in full:
              lines.insert(last_include + 1, shim)
          full = ''.join(lines)
          full = full.replace('gi2c->base,', 'gi2c->se.base,')
          full = full.replace('gi2c->base +', 'gi2c->se.base +')
          with open('drivers/i2c/busses/i2c-qcom-geni.c', 'w') as f:
              f.write(full)
          print("i2c-qcom-geni.c OK")

          # Fix 10: flask.h
          flask_path = 'security/selinux/include/flask.h'
          if not os.path.exists(flask_path):
              with open(flask_path, 'w') as f:
                  f.write("/* Auto-generated */\n#ifndef _SELINUX_FLASK_H_\n"
                          "#define _SELINUX_FLASK_H_\n"
                          "#define SECCLASS_SECURITY 1\n#define SECCLASS_PROCESS 2\n"
                          "#define SECCLASS_FILE 4\n#define SECINITSID_KERNEL 1\n"
                          "#define SECINITSID_UNLABELED 3\n#define SECINITSID_NUM 27\n"
                          "#endif\n")
          print("flask.h OK")

          # Fix 11: sidtab.h
          sidtab_path = 'security/selinux/ss/sidtab.h'
          if os.path.exists(sidtab_path):
              with open(sidtab_path, 'r') as f:
                  c = f.read()
              if 'CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS' in c and \
                 '#ifndef CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS' not in c:
                  guard = ('#ifndef CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS\n'
                           '#define CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS 9\n'
                           '#endif\n')
                  lines = c.split('\n')
                  last_inc = max((i for i, l in enumerate(lines) if l.strip().startswith('#include')), default=0)
                  lines.insert(last_inc + 1, guard)
                  with open(sidtab_path, 'w') as f:
                      f.write('\n'.join(lines))
          print("sidtab.h OK")

          # Fix 12: av_permissions.h
          av_perm_path = 'security/selinux/include/av_permissions.h'
          if not os.path.exists(av_perm_path):
              with open(av_perm_path, 'w') as f:
                  f.write(
                      '/* Auto-generated */\n#ifndef _SELINUX_AV_PERMISSIONS_H_\n'
                      '#define _SELINUX_AV_PERMISSIONS_H_\n'
                      '#define FILE__EXECUTE      0x00000001UL\n'
                      '#define FILE__WRITE        0x00000002UL\n'
                      '#define FILE__READ         0x00000004UL\n'
                      '#define FILE__OPEN         0x00000800UL\n'
                      '#define PROCESS__FORK      0x00000001UL\n'
                      '#define PROCESS__PTRACE    0x00000040UL\n'
                      '#define PROCESS__EXECMEM   0x01000000UL\n'
                      '#define SECURITY__LOAD_POLICY 0x00000010UL\n'
                      '#define SECURITY__SETENFORCE  0x00000080UL\n'
                      '#endif\n')
          print("av_permissions.h OK")

          # Fix 13: Remove broken Motorola drivers
          drv_makefile = 'drivers/Makefile'
          with open(drv_makefile, 'r') as f:
              lines = f.readlines()
          lines = [l for l in lines if 'moto_mm' not in l and 'moto_swap' not in l]
          with open(drv_makefile, 'w') as f:
              f.writelines(lines)
          print("drivers/Makefile moto removed OK")

          # Fix 14: mmi-smbcharger-iio
          power_mk = 'drivers/power/Makefile'
          if os.path.exists(power_mk):
              with open(power_mk, 'r') as f:
                  lines = f.readlines()
              lines = [l for l in lines if 'mmi-smbcharger' not in l]
              with open(power_mk, 'w') as f:
                  f.writelines(lines)
              print("power/Makefile mmi-smbcharger removed OK")

          # Fix 15: stmmac
          stmicro_mk = 'drivers/net/ethernet/stmicro/Makefile'
          if os.path.exists(stmicro_mk):
              with open(stmicro_mk, 'r') as f:
                  lines = f.readlines()
              lines = [l for l in lines if 'stmmac' not in l]
              with open(stmicro_mk, 'w') as f:
                  f.writelines(lines)
              print("stmicro stmmac removed OK")

          # Fix 16: mdt_loader.c
          mdt_path = 'drivers/soc/qcom/mdt_loader.c'
          with open(mdt_path, 'r') as f:
              c = f.read()
          c = re.sub(r'dev_err\(dev,\s*', 'pr_err(', c)
          c = re.sub(r'dev_warn\(dev,\s*', 'pr_warn(', c)
          c = re.sub(r'dev_info\(dev,\s*', 'pr_info(', c)
          c = re.sub(r'dev_dbg\(dev,\s*', 'pr_debug(', c)
          with open(mdt_path, 'w') as f:
              f.write(c)
          print("mdt_loader.c OK")

          # Fix 17: Find aw_* callers and disable them via defconfig
          # Scan all drivers to find who calls aw_send_afe_cal_apr
          aw_callers = []
          for path in glob.glob('drivers/**/*.c', recursive=True) + \
                      glob.glob('sound/**/*.c', recursive=True):
              try:
                  with open(path, 'r', errors='ignore') as f:
                      c = f.read()
                  if 'aw_send_afe_cal_apr' in c or 'aw_adm_param_enable' in c:
                      aw_callers.append(path)
                      print(f"aw_* caller found: {path}")
              except:
                  pass
          # Remove from their Makefile
          for caller in aw_callers:
              fname = os.path.basename(caller).replace('.c', '')
              mk = os.path.join(os.path.dirname(caller), 'Makefile')
              if os.path.exists(mk):
                  with open(mk, 'r') as f:
                      lines = f.readlines()
                  new = [l for l in lines if fname not in l]
                  if len(new) != len(lines):
                      with open(mk, 'w') as f:
                          f.writelines(new)
                      print(f"  removed {fname} from Makefile")
          print("aw_* callers handled OK")

          # Fix 18: Find drm_panel_notifier callers and remove them
          # Working kernel uses MSM_SERVICE_NOTIFIER not DRM_PANEL_NOTIFIER
          drm_callers = []
          for path in glob.glob('drivers/**/*.c', recursive=True):
              try:
                  with open(path, 'r', errors='ignore') as f:
                      c = f.read()
                  if 'drm_panel_notifier_register' in c or 'drm_panel_notifier_unregister' in c:
                      drm_callers.append(path)
                      print(f"drm_panel_notifier caller: {path}")
              except:
                  pass
          for caller in drm_callers:
              fname = os.path.basename(caller).replace('.c', '')
              mk = os.path.join(os.path.dirname(caller), 'Makefile')
              if os.path.exists(mk):
                  with open(mk, 'r') as f:
                      lines = f.readlines()
                  new = [l for l in lines if fname not in l]
                  if len(new) != len(lines):
                      with open(mk, 'w') as f:
                          f.writelines(new)
                      print(f"  removed {fname} from Makefile")
          print("drm_panel_notifier callers handled OK")

          print("All patches done")
          PYEOF

          # Disable NFS
          for cfg in CONFIG_NFS_FS CONFIG_NFS_V2 CONFIG_NFS_V3 CONFIG_NFS_V4; do
            sed -i "s/${cfg}=y/# ${cfg} is not set/" arch/arm64/configs/defconfig
            sed -i "s/${cfg}=m/# ${cfg} is not set/" arch/arm64/configs/defconfig
          done

          # Confirmed from working kernel config
          echo "CONFIG_QCOM_QMI_HELPERS=y" >> arch/arm64/configs/defconfig
          echo "CONFIG_QCOM_SCM=y" >> arch/arm64/configs/defconfig
          sed -i 's/CONFIG_QCOM_SCM=m/CONFIG_QCOM_SCM=y/' arch/arm64/configs/defconfig
          echo "CONFIG_MSM_SERVICE_NOTIFIER=y" >> arch/arm64/configs/defconfig

          # Disable AW882XX (confirmed disabled in working kernel)
          echo "# CONFIG_SND_SOC_AW882XX is not set" >> arch/arm64/configs/defconfig
          echo "# CONFIG_SND_SOC_AW87XXX is not set" >> arch/arm64/configs/defconfig

          # Enable SuSFS
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> arch/arm64/configs/defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> arch/arm64/configs/defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> arch/arm64/configs/defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> arch/arm64/configs/defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> arch/arm64/configs/defconfig
          echo "All defconfig changes applied"

      - name: Enable KernelSU and setup defconfig
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/defconfig
          make O=out defconfig \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build kernel
        run: |
          make -C . O=out -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log; \
          exit ${PIPESTATUS[0]}

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
