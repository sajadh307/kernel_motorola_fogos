name: build_kernel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git clang gcc make bc bison flex libncurses-dev libssl-dev python3 rsync unzip

      - name: Move KernelSU folder safely
        run: |
          if [ -f drivers/kernelsu ]; then
            echo "drivers/kernelsu is a file, deleting..."
            rm -f drivers/kernelsu
          elif [ -d drivers/kernelsu ]; then
            echo "drivers/kernelsu is a directory, deleting..."
            rm -rf drivers/kernelsu
          fi
          mv KernelSU drivers/kernelsu

      - name: Load defconfig
        run: |
          make ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE defconfig

      - name: Build kernel
        run: |
          make -j$(nproc) ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE

      - name: Package kernel
        run: |
          mkdir -p out
          cp -v arch/arm64/boot/Image.gz-dtb out/

      - name: Upload compiled kernel
        uses: actions/upload-artifact@v3
        with:
          name: compiled-kernel
          path: out/
