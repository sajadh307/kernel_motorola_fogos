name: Build Motorola G45 Kernel (KernelSU ready)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install dependencies including ARM64 cross-compiler
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y git wget curl zip unzip python3 make clang gcc bc bison flex \
            libncurses-dev rsync libssl-dev crossbuild-essential-arm64

      # 3️⃣ Move KernelSU folder to drivers/kernelsu
      - name: Move KernelSU folder
        run: |
          # Remove any existing file/folder to avoid errors
          if [ -e drivers/kernelsu ]; then
            rm -rf drivers/kernelsu
          fi
          # Move KernelSU to correct folder
          mv KernelSU drivers/kernelsu

      # 4️⃣ Load lahaina_GKI_defconfig
      - name: Load defconfig
        run: |
          cp arch/arm64/configs/vendor/lahaina_GKI.config arch/arm64/configs/lahaina_GKI_defconfig
          make ARCH=arm64 lahaina_GKI_defconfig

      # 5️⃣ Build kernel using all cores
      - name: Build kernel
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE

      # 6️⃣ Package kernel + DTBs + KernelSU folder
      - name: Package kernel
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image.gz-dtb out/
          cp arch/arm64/boot/dts/qcom/*.dtb out/ || true
          cp -r drivers/kernelsu out/KernelSU || true
          zip -r motorola_g45_kernel.zip out

      # 7️⃣ Upload compiled kernel as artifact
      - name: Upload compiled kernel
        uses: actions/upload-artifact@v4
        with:
          name: motorola_g45_kernel
          path: motorola_g45_kernel.zip
