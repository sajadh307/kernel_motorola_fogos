name: Build Fogos Kernel

on:
  push:
    branches:
      - 15.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout source
    - name: Checkout source
      uses: actions/checkout@v3

    # 2. Install dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        bc bison build-essential flex curl zip \
        libssl-dev libelf-dev git python3 \
        clang lld ccache

    # 3. Setup ccache (faster builds)
    - name: Setup ccache
      run: |
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        echo "USE_CCACHE=1" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
        ccache -M 5G

    # 4. Clone Proton Clang
    - name: Clone Proton Clang
      run: |
        git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

    # 5. Export environment
    - name: Setup environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "KBUILD_BUILD_USER=sajad" >> $GITHUB_ENV
        echo "KBUILD_BUILD_HOST=github" >> $GITHUB_ENV
        echo "PATH=$(pwd)/clang/bin:$PATH" >> $GITHUB_ENV

    # 6. Clean output
    - name: Clean
