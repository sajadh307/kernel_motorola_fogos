name: Build Fogos Kernel

on:
  push:
    branches:
      - 15.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex curl zip \
          libssl-dev libelf-dev git python3 clang lld

      - name: Clone Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Setup environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "PATH=$(pwd)/clang/bin:$PATH" >> $GITHUB_ENV

      - name: Prepare build
        run: |
          rm -rf out
          mkdir out

      - name: Load config
        run: |
          make O=out ARCH=arm64 fogos_stock_config

      - name: Build kernel
        run: |
          make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload kernel
        uses: actions/upload-artifact@v3
        with:
          name: kernel
          path: out/arch/arm64/boot/
